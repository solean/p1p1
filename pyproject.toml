[project]
name = "p1p1"
version = "0.1.0"
description = "Pack-curation pipeline for a daily MTG pack-1-pick-1 game"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.scripts]
p1p1 = "p1p1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p1p1"]
